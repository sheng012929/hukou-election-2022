const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function filtered(){const q=$('search').value.trim().toLowerCase(),v=$('village').value;return booths.filter(b=>(!v||b.village===v)&&(!q||b.pollingStation.toLowerCase().includes(q)||b.village.toLowerCase().includes(q)||String(b.number).includes(q))).sort((a,b)=>{let x=a[sort.key],y=b[sort.key];if(sort.key==='votes')x=a.votes[$('candidate').value]||0,y=b.votes[$('candidate').value]||0;if(typeof x==='string')return x.localeCompare(y,'zh-Hant')*sort.dir;return (x-y)*sort.dir})}

function render(){const rows=filtered();$('count').textContent=`顯示 ${rows.length} / 54 所`;let h='',title='',desc='';if(view==='votes'){title='各投開票所候選人票數';desc='點選欄位標題可排序；票數為候選人於該所所得票數。';h='<table><thead><tr><th>投開票所</th>'+names.map(n=>`<th data-sort="votes">${n}</th>`).join('')+'</tr></thead><tbody>'+rows.map(b=>`<tr><td>${esc(b.pollingStation)}</td>${names.map(n=>`<td>${fmt(b.votes[n])}</td>`).join('')}</tr>`).join('')+'</tbody></table>'}else if(view==='rank'){title='每個投開票所的候選人排序';desc='選擇候選人可依該候選人票數排序；每所列出前三名。';let pick=$('candidate').value;h='<table><thead><tr><th>投開票所</th><th>第一名</th><th>第二名</th><th>第三名</th><th>前三名合計</th></tr></thead><tbody>'+rows.map(b=>{let r=names.map(n=>[n,b.votes[n]]).sort((a,c)=>c[1]-a[1]);return `<tr><td>${esc(b.pollingStation)}</td>${r.slice(0,3).map(x=>`<td>${x[0]} <b>${fmt(x[1])}</b></td>`).join('')}<td>${fmt(r.slice(0,3).reduce((s,x)=>s+x[1],0))}</td></tr>`}).join('')+'</tbody></table>'}else if(view==='turnout'){title='投票率、有效票與無效票';desc='查看各所投票率，並比較無效票占投票數比例。';h='<table><thead><tr><th>投開票所</th><th>選舉人數</th><th>投票數</th><th>投票率</th><th>有效票</th><th>無效票</th><th>無效票率</th></tr></thead><tbody>'+rows.map(b=>`<tr><td>${esc(b.pollingStation)}</td><td>${fmt(b.eligible)}</td><td>${fmt(b.ballots)}</td><td><span class="pill">${b.turnout.toFixed(2)}%</span></td><td>${fmt(b.valid)}</td><td>${fmt(b.invalid)}</td><td>${(b.invalid/b.ballots*100).toFixed(2)}%</td></tr>`).join('')+'</tbody></table>'}else{title='候選人跨投開票所比較';desc='選一位候選人，觀察各所得票、得票率與鄉內總票數分布。';let c=$('candidate').value||names[0];h=`<table><thead><tr><th>投開票所</th><th>${c} 得票</th><th>該所有效票占比</th><th>全鄉得票分布</th><th>全鄉累計得票</th></tr></thead><tbody>`+rows.map(b=>{let x=b.votes[c],p=x/b.valid*100,share=x/totals[c]*100;return `<tr><td>${esc(b.pollingStation)}</td><td><b>${fmt(x)}</b></td><td>${p.toFixed(2)}%</td><td class="barcell">${share.toFixed(2)}%<div class="bar"><i style="width:${Math.max(2,share*8)}%"></i></div></td><td>${fmt(totals[c])}</td></tr>`}).join('')+'</tbody></table>'}$('title').textContent=title;$('desc').textContent=desc;$('table').innerHTML=h;setup()}
function exportCsv(){let rows=filtered(),head=['投開票所','村里','選舉人數','投票數','投票率','有效票','無效票',...names];let csv=[head,...rows.map(b=>[b.pollingStation,b.village,b.eligible,b.ballots,b.turnout+'%',b.valid,b.invalid,...names.map(n=>b.votes[n])])].map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));a.download='2022_新竹縣議員_湖口鄉_投開票所票數.csv';a.click();URL.revokeObjectURL(a.href)}render();
</script></body></html>
